<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Guardarol</title>
    <link rel="stylesheet" href="/static/tailwind.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600&display=swap" rel="stylesheet">
</head>
<body class="font-outfit bg-dracula-bg text-dracula-fg min-h-screen flex justify-center items-center p-5 bg-fixed"
      style="background-image: radial-gradient(at 0% 0%, rgba(189,147,249,0.15) 0px, transparent 50%), radial-gradient(at 100% 0%, rgba(255,121,198,0.15) 0px, transparent 50%);">
    <button id="historyBtn" type="button" title="Historial de descargas"
            class="fixed top-4 right-4 z-[9000] bg-[#44475a]/60 backdrop-blur-md border border-dracula-purple/20 rounded-full w-11 h-11 flex items-center justify-center cursor-pointer transition-all hover:border-dracula-purple hover:shadow-[0_0_15px_rgba(189,147,249,0.3)]">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#bd93f9" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 4v5h5"/><path d="M12 7v5l3 3"/></svg>
    </button>
    <div class="bg-[#44475a]/40 backdrop-blur-xl border border-dracula-purple/20 rounded-3xl p-8 md:p-12 w-[90%] max-w-[600px] text-center shadow-[0_20px_50px_rgba(0,0,0,0.3)]">
        <h1 class="text-4xl md:text-[2.5rem] font-semibold mb-6 drop-shadow-[0_0_10px_rgba(189,147,249,0.3)]">
            <span class="text-dracula-purple">Guarda</span><span class="text-dracula-pink">rol</span>
        </h1>

        <form id="downloadForm">
            <div class="flex flex-col md:flex-row gap-3 md:gap-2.5 bg-black/20 p-2 md:p-2 rounded-3xl md:rounded-full border border-dracula-purple/20 focus-within:border-dracula-purple focus-within:shadow-[0_0_15px_rgba(189,147,249,0.3)] transition-all">
                <input type="text" id="urlInput" placeholder="Video, playlist o canal… p. ej. youtube.com/@artista/videos" required
                       class="flex-1 bg-black/20 md:bg-transparent border border-dracula-purple/20 md:border-0 rounded-full px-5 py-3.5 md:py-3 text-base outline-none placeholder:text-dracula-comment/80 w-full box-border">
                <button type="submit" id="downloadBtn"
                        class="bg-dracula-purple text-dracula-bg rounded-full px-7 py-3.5 md:py-3 font-semibold cursor-pointer transition-all shadow-[0_4px_15px_rgba(189,147,249,0.2)] hover:bg-dracula-pink hover:-translate-y-0.5 hover:shadow-[0_6px_20px_rgba(255,121,198,0.4)] w-full md:w-auto box-border">
                    Guardar
                </button>
            </div>
        </form>

        <p class="mt-6 font-light text-dracula-comment">Desarrollado con ❤️ por <a href="https://github.com/joeis-dev" class="text-dracula-cyan font-semibold transition-all hover:text-dracula-pink">Joe</a></p>
    </div>

    <div id="feedbackContainer" class="hidden fixed bottom-6 left-1/2 -translate-x-1/2 z-[10000] pl-6 pr-3 py-3 rounded-full bg-[#282a36]/90 backdrop-blur-md shadow-[0_10px_30px_rgba(0,0,0,0.5)] max-w-[min(90vw,480px)] text-center flex items-center gap-2">
        <p id="feedbackText" class="flex-1"></p>
        <button id="feedbackClose" type="button" title="Cerrar"
                class="shrink-0 w-7 h-7 rounded-full border border-dracula-comment/40 text-dracula-comment text-sm leading-none cursor-pointer transition-all hover:text-dracula-fg hover:border-dracula-fg">✕</button>
    </div>

    <div id="orbOverlay" class="hidden fixed inset-0 z-[9999] flex justify-center items-center bg-[#14151e]/55 backdrop-blur-[14px] p-5" aria-hidden="true">
        <div class="orb-card relative bg-[#282a36]/85 border border-dracula-purple/20 rounded-3xl px-8 pt-10 pb-8 w-full max-w-[380px] text-center shadow-[0_0_60px_rgba(189,147,249,0.25),0_20px_50px_rgba(0,0,0,0.5)] flex flex-col items-center gap-2.5" role="dialog" aria-label="Descargando">
            <svg class="orb-ring w-[150px] h-[150px]" viewBox="0 0 120 120">
                <circle cx="60" cy="60" r="52" fill="none" stroke="#44475a" stroke-width="10"></circle>
                <circle id="orbProgress" class="orb-fill" cx="60" cy="60" r="52" fill="none" stroke="#bd93f9" stroke-width="10" stroke-linecap="round"></circle>
            </svg>
            <div id="orbPercent" class="absolute top-[6.1rem] text-[1.6rem] font-semibold text-transparent bg-clip-text bg-gradient-to-r from-dracula-purple to-dracula-pink">0%</div>
            <div id="orbCount" class="text-[0.95rem] text-dracula-cyan font-semibold">Preparando…</div>
            <div class="w-full h-2.5 rounded-full bg-black/40 border border-dracula-purple/20 overflow-hidden"><div id="orbBarFill" class="orb-bar-fill h-full w-0 rounded-full bg-gradient-to-r from-dracula-purple to-dracula-pink shadow-[0_0_12px_rgba(255,121,198,0.6)]"></div></div>
            <p id="orbTitle" class="text-sm max-w-full overflow-hidden text-ellipsis line-clamp-2 min-h-[2.4em]">Resolviendo URL…</p>
            <p id="orbStage" class="text-xs text-dracula-comment min-h-[1.2em]"></p>
            <div class="mt-2 flex gap-2">
                <button id="orbPause" type="button" class="bg-transparent border border-dracula-yellow text-dracula-yellow rounded-full px-6 py-2.5 font-semibold cursor-pointer transition-all hover:bg-dracula-yellow hover:text-dracula-bg">Pausar</button>
                <button id="orbCancel" type="button" class="bg-transparent border border-dracula-red text-dracula-red rounded-full px-6 py-2.5 font-semibold cursor-pointer transition-all hover:bg-dracula-red hover:text-dracula-bg">Cancelar</button>
            </div>
        </div>
    </div>

    <div id="historyOverlay" class="hidden fixed inset-0 z-[9500] bg-[#14151e]/95 backdrop-blur-[10px] overflow-y-auto" aria-hidden="true">
        <div class="w-full max-w-[720px] mx-auto px-4 md:px-8 py-6 min-h-full" role="dialog" aria-label="Historial de descargas">
            <div class="flex items-center gap-3 mb-5 sticky top-0 bg-[#14151e]/95 py-3">
                <button id="historyBack" type="button" title="Volver"
                        class="shrink-0 h-10 px-4 rounded-full bg-dracula-purple text-dracula-bg font-semibold cursor-pointer transition-all hover:bg-dracula-pink">← Volver</button>
                <h2 class="text-xl font-semibold flex-1">Historial de descargas</h2>
                <button id="historyClear" type="button" title="Borrar todo el historial"
                        class="shrink-0 h-10 px-4 rounded-full bg-transparent border border-dracula-red/50 text-dracula-red text-sm font-semibold cursor-pointer transition-all hover:bg-dracula-red hover:text-dracula-bg">🗑 Limpiar</button>
            </div>
            <div id="historyList" class="flex flex-col gap-3 text-left pb-10"></div>
        </div>
    </div>

    <div id="detailOverlay" class="hidden fixed inset-0 z-[9600] bg-black/60 backdrop-blur-[10px] p-4 flex justify-center items-start overflow-y-auto" aria-hidden="true">
        <div class="bg-[#282a36] border border-dracula-purple/20 rounded-3xl w-full max-w-[600px] p-6 my-10 shadow-[0_20px_50px_rgba(0,0,0,0.6)]" role="dialog" aria-label="Detalle del job">
            <div class="flex items-center justify-between mb-4">
                <h3 class="text-lg font-semibold">Detalle</h3>
                <button id="detailClose" type="button" title="Cerrar"
                        class="w-8 h-8 rounded-full border border-dracula-comment/40 text-dracula-comment cursor-pointer transition-all hover:text-dracula-fg hover:border-dracula-fg">✕</button>
            </div>
            <div id="detailBody" class="flex flex-col gap-3 text-sm"></div>
        </div>
    </div>

    <script src="/static/script.js"></script>
</body>
</html>
