<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Guarda rolas</title>
    <link rel="stylesheet" href="/static/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600&display=swap" rel="stylesheet">
</head>
<body>
    <div class="glass-container">
        <h1>Guarda rolas</h1>

        <form id="downloadForm">
            <div class="input-group">
                <input type="text" id="urlInput" placeholder="Video, playlist o canal… p. ej. youtube.com/@artista/videos" required>
                <button type="submit" id="downloadBtn">Guardar</button>
            </div>
        </form>

        <div id="feedbackContainer" class="hidden">
            <p id="feedbackText"></p>
        </div>

        <p class="subtitle">Desarrollado con ❤️ por <a href="https://github.com/joeis-dev">Joe</a></p>
    </div>

    <div id="orbOverlay" class="hidden" aria-hidden="true">
        <div class="orb-card" role="dialog" aria-label="Descargando">
            <svg class="orb-ring" viewBox="0 0 120 120">
                <circle class="orb-track" cx="60" cy="60" r="52"></circle>
                <circle id="orbProgress" class="orb-fill" cx="60" cy="60" r="52"></circle>
            </svg>
            <div id="orbPercent" class="orb-percent">0%</div>
            <div id="orbCount" class="orb-count">Preparando…</div>
            <div class="orb-bar"><div id="orbBarFill" class="orb-bar-fill"></div></div>
            <p id="orbTitle" class="orb-title">Resolviendo URL…</p>
            <p id="orbStage" class="orb-stage"></p>
            <button id="orbCancel" type="button">Cancelar</button>
        </div>
    </div>

    <script src="/static/script.js"></script>
</body>
</html>
